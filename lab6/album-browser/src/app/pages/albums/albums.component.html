<h1>Albums</h1>

<div *ngIf="loading">Loading albums...</div>
<div *ngIf="error">{{ error }}</div>

<div *ngIf="!loading && albums.length === 0">
  No albums found.
</div>

<div *ngIf="!loading && albums.length > 0">
  <div *ngFor="let album of albums" (click)="openAlbum(album.id)">
    <h3>#{{ album.id }}</h3>
    <p>{{ album.title }}</p>
    <button (click)="deleteAlbum(album.id, $event)">Delete</button>
  </div>
</div>
