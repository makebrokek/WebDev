<div class="card">
  <img class="main-img" [src]="product.image" [alt]="product.name" />

  <h3>{{ product.name }}</h3>
  <p class="desc">{{ product.description }}</p>

  <div class="row">
    <span class="price">{{ product.price }} KZT</span>
    <span class="rating">⭐ {{ product.rating }}</span>
  </div>

  <div class="likes">❤ {{ product.likes }}</div>

  <div class="actions">
    <button (click)="like()">Like</button>
    <button class="danger" (click)="remove()">Delete</button>
  </div>

  <div class="share">
    <button (click)="shareWhatsApp()">WhatsApp</button>
    <button (click)="shareTelegram()">Telegram</button>
  </div>

  <a class="kaspi" [href]="product.link" target="_blank">Open on Kaspi</a>
</div>
